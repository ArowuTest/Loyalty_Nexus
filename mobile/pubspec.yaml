name: loyalty_nexus
description: Loyalty Nexus — Nigeria's Premium Loyalty Rewards App
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Data / serialization

  # HTTP
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.5

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  confetti: ^0.8.0
  connectivity_plus: ^6.1.4

  # QR Code generation (Digital Passport)
  qr_flutter: ^4.1.0

  # File / media picking & upload (AI Studio templates)
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  mime: ^1.0.6

  # Audio recording (Transcribe template mic input)
  record: ^5.1.2
  path_provider: ^2.1.4
  just_audio: ^0.9.42
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Speech-to-text (mic dictation in templates)
  speech_to_text: ^7.0.0

  # Device / Platform
  url_launcher: ^6.3.1

  # Website Builder + sharing
  webview_flutter: ^4.10.0
  share_plus: ^10.1.4

  # Notifications
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

  # Analytics
  firebase_analytics: ^11.4.0

  # Crash reporting — without this a tester crash tells us nothing.
  firebase_crashlytics: ^4.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  record_linux: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
  fonts:
    # Bundled deliberately. google_fonts fetches from fonts.gstatic.com at
    # theme-build time, which on a poor connection renders a fallback font and
    # re-lays-out when it lands — and fails outright in tests.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 800
