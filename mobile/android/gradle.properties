# ── JVM memory ────────────────────────────────────────────────────────────────
# Was -Xmx1536m, which OOM'd ("Java heap space") in JetifyTransform while
# resolving the Flutter engine jars on CI. 4 GB is comfortable on GitHub's
# 7 GB runners while leaving room for the Kotlin daemon below.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# CI-friendly: no daemon reuse across jobs. Parallelism kept off deliberately —
# it was tuned down alongside the old low heap; revisit only once builds are
# reliably green, one variable at a time.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1

kotlin.incremental=false
kotlin.daemon.jvm.options=-Xmx2048m

# ── AndroidX ──────────────────────────────────────────────────────────────────
android.useAndroidX=true

# Jetifier rewrites legacy android.support.* artifacts to AndroidX. It is
# DISABLED because it is both unnecessary and actively harmful here:
#   · Nothing needs it — no android.support.* reference exists anywhere in
#     android/, and every plugin in pubspec.yaml is AndroidX-native
#     (video_player 2.9, webview_flutter 4.10, firebase_core 3.11, ...).
#   · It was the direct cause of the CI failure: JetifyTransform loads each jar
#     into memory and blew the heap on the Flutter engine jars.
#   · It is deprecated as of AGP 8 (this project is on AGP 8.7.0).
# Turning it off removes the failing transform entirely and speeds up the build.
android.enableJetifier=false
