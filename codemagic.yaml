# Loyalty Nexus — Codemagic CI/CD
#
# WHY THIS EXISTS: iOS .ipa files can only be built on macOS. The team develops on
# Windows, so Codemagic's cloud Mac runners are the only route to TestFlight.
# Android is built here too so both platforms share one pipeline and one Flutter pin.
#
# Flutter is pinned to 3.44.3 to match .github/workflows/{ci,mobile-apk}.yml and the
# local dev SDK. Keep all four in sync — a mismatch silently reintroduces the
# CardTheme/CardThemeData class of breakage.
#
# ── ONE-TIME SETUP (see docs/MOBILE_RELEASE_SETUP.md) ────────────────────────────
#   iOS      · App Store Connect API key as Codemagic integration "loyalty-nexus-asc"
#            · Bundle ID ng.loyaltynexus.loyaltyNexus registered + app record created
#   Android  · Keystore uploaded to Codemagic as reference "loyalty_nexus_keystore"
#              — MUST be the same keystore as the GitHub secret ANDROID_KEYSTORE_BASE64,
#                or existing testers cannot upgrade in place
#            · Firebase service-account JSON in group "firebase_credentials"
#   Both     · Tester groups configured in TestFlight + Firebase App Distribution
#
# Firebase client configs (google-services.json / GoogleService-Info.plist) are
# tracked in the repo, so nothing is injected for them.

definitions:
  flutter_version: &flutter_version 3.44.3

  common_scripts:
    - &pub_get
      name: Flutter pub get
      script: |
        cd mobile
        flutter pub get

    - &analyze
      name: Flutter analyze
      script: |
        cd mobile
        # Errors and warnings fail the build. Infos (style hints) do not.
        flutter analyze --no-fatal-infos

    - &test
      name: Flutter test
      script: |
        cd mobile
        # Deliberately NOT `|| true`. A test step that cannot fail manufactures
        # false confidence — that is exactly how a broken suite went unnoticed.
        flutter test --reporter=compact

workflows:

  # ────────────────────────────────────────────────────────────────────────────
  # iOS → TestFlight
  # ────────────────────────────────────────────────────────────────────────────
  ios-testflight:
    name: iOS — Build & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ng.loyaltynexus.loyaltyNexus
      groups:
        - appstore_credentials
      vars:
        # Compile-time API base. Override per-workflow to point test builds at
        # staging; production is NOT assumed silently.
        API_URL: 'https://loyalty-nexus-api.onrender.com/api/v1'

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true

    scripts:
      - *pub_get
      - *analyze
      - *test

      - name: Apply signing profiles to the Xcode project
        script: |
          # REQUIRED. This is what writes /Users/builder/export_options.plist and
          # rewrites CODE_SIGN_IDENTITY / DEVELOPMENT_TEAM in the project. Without
          # it, `flutter build ipa --export-options-plist=...` fails at export
          # because that file never exists.
          xcode-project use-profiles

      - name: Derive version from the git tag
        script: |
          # CFBundleVersion must strictly increase or TestFlight rejects the
          # upload as duplicate/lower. Codemagic's BUILD_NUMBER is monotonic.
          # CFBundleShortVersionString comes from the tag (v1.2.0 -> 1.2.0), so
          # tagging actually changes what testers see — previously every build
          # shipped as 1.0.0 regardless of tag.
          TAG="${CM_TAG:-v0.0.0}"
          echo "BUILD_NAME=${TAG#v}" >> $CM_ENV
          echo "BUILD_NUM=${BUILD_NUMBER}" >> $CM_ENV

      - name: Build IPA
        script: |
          cd mobile
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUM" \
            --dart-define=API_URL="$API_URL" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # NOTE: with no beta_groups the build lands in App Store Connect but is
        # attached to NO tester group — someone must assign it manually. Uncomment
        # and set the real group name once it exists in TestFlight.
        # beta_groups:
        #   - Internal Testers
        submit_to_app_store: false

      email:
        recipients:
          - fsanus20111@gmail.com
        notify:
          success: true
          failure: true

  # ────────────────────────────────────────────────────────────────────────────
  # Android → Firebase App Distribution
  # ────────────────────────────────────────────────────────────────────────────
  android-firebase:
    name: Android — Build & Firebase App Distribution
    instance_type: linux_x2
    max_build_duration: 45

    environment:
      flutter: *flutter_version
      java: 17
      android_signing:
        - loyalty_nexus_keystore
      groups:
        - firebase_credentials
      vars:
        API_URL: 'https://loyalty-nexus-api.onrender.com/api/v1'

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true

    scripts:
      - *pub_get
      - *analyze
      - *test

      - name: Write key.properties from Codemagic keystore
        script: |
          set -e
          # Validate BEFORE writing. Gradle now fails hard on a blank signing value
          # rather than silently defaulting it to "" — but a clear message HERE
          # beats one ten minutes later inside :app:packageRelease. That is exactly
          # how `KeytoolException: No key with alias ''` reached us on GitHub
          # Actions, and this workflow writes the same file the same way.
          #
          # These CM_* variables are populated by Codemagic from the keystore
          # uploaded under the reference name in `android_signing:`. If that upload
          # is missing or misnamed they are silently EMPTY.
          missing=""
          [ -n "$CM_KEYSTORE_PATH" ]     || missing="$missing CM_KEYSTORE_PATH"
          [ -n "$CM_KEYSTORE_PASSWORD" ] || missing="$missing CM_KEYSTORE_PASSWORD"
          [ -n "$CM_KEY_PASSWORD" ]      || missing="$missing CM_KEY_PASSWORD"
          [ -n "$CM_KEY_ALIAS" ]         || missing="$missing CM_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "ERROR: empty Codemagic signing variable(s):$missing"
            echo "Check Code signing -> Android keystore is uploaded with reference"
            echo "name 'loyalty_nexus_keystore' (must match android_signing: below)."
            exit 1
          fi
          [ -f "$CM_KEYSTORE_PATH" ] || { echo "ERROR: keystore not at $CM_KEYSTORE_PATH"; exit 1; }

          cat > mobile/android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          # Never echo the values themselves.
          echo "key.properties written (alias length: ${#CM_KEY_ALIAS}, keystore present)"

      - name: Derive version from the git tag
        script: |
          TAG="${CM_TAG:-v0.0.0}"
          echo "BUILD_NAME=${TAG#v}" >> $CM_ENV
          echo "BUILD_NUM=${BUILD_NUMBER}" >> $CM_ENV

      - name: Build release APK
        script: |
          cd mobile
          # APK (not AAB) so Firebase App Distribution testers can sideload directly.
          set +e
          flutter build apk --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUM" \
            --dart-define=API_URL="$API_URL"
          rc=$?
          set -e

          # This project's android/build.gradle.kts has NO buildDir redirect, so
          # AGP writes to android/app/build/outputs/ while flutter — and the
          # `artifacts:` globs below — look under mobile/build/. That mismatch is
          # why flutter reports "Gradle build failed to produce an .apk file" even
          # on a successful build, and it would leave Codemagic collecting NOTHING
          # and publishing NOTHING to Firebase, with no error naming the cause.
          APK=$(find . -name '*.apk' -path '*release*' -size +1M 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK produced (flutter exit $rc)"
            find . -name '*.apk' 2>/dev/null || echo "  (none)"
            exit 1
          fi
          mkdir -p build/app/outputs/flutter-apk
          [ "$APK" = "./build/app/outputs/flutter-apk/app-release.apk" ] || \
            cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          echo "release APK: $APK"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Build release AAB
        script: |
          cd mobile
          # AAB for the eventual Play Console upload.
          set +e
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUM" \
            --dart-define=API_URL="$API_URL"
          rc=$?
          set -e

          # Prefer the FINAL bundle under outputs/. Gradle also leaves an
          # UNSIGNED intermediary-bundle.aab under intermediates/, which is
          # larger and sorts first — the previous `find . -name '*.aab'`
          # picked exactly that, and Play rejects an unsigned bundle.
          AAB=$(find . -path '*outputs/bundle/*' -name '*.aab' -size +1M 2>/dev/null | head -1)
          [ -n "$AAB" ] || AAB=$(find . -name '*.aab' -size +1M -not -path '*intermediates*' 2>/dev/null | head -1)
          if [ -z "$AAB" ]; then
            echo "No release AAB produced (flutter exit $rc)"
            find . -name '*.aab' 2>/dev/null || echo "  (none)"
            exit 1
          fi
          mkdir -p build/app/outputs/bundle/release
          [ "$AAB" = "./build/app/outputs/bundle/release/app-release.aab" ] || \
            cp "$AAB" build/app/outputs/bundle/release/app-release.aab

          # R8 mapping. Without it, Crashlytics stack traces from release builds
          # are unreadable — which defeats the point of shipping Crashlytics.
          MAP=$(find . -name 'mapping.txt' -path '*release*' 2>/dev/null | head -1)
          if [ -n "$MAP" ]; then
            mkdir -p build/app/outputs/mapping/release
            [ "$MAP" = "./build/app/outputs/mapping/release/mapping.txt" ] || \
              cp "$MAP" build/app/outputs/mapping/release/mapping.txt
            echo "mapping: $MAP"
          fi
          echo "release AAB: $AAB"
          ls -lh build/app/outputs/bundle/release/app-release.aab

    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-release.apk
      - mobile/build/app/outputs/bundle/release/app-release.aab
      - mobile/build/app/outputs/mapping/release/mapping.txt

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: 1:693548905840:android:e5dfd61334e514dcdfcbb5
          groups:
            - testers
          artifact_type: apk

      email:
        recipients:
          - fsanus20111@gmail.com
        notify:
          success: true
          failure: true
