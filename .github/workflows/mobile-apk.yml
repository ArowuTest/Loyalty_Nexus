# Mobile — Release Verification Gate
#
# ROLE OF THIS WORKFLOW (deliberate split):
#   GitHub Actions  = VERIFY. Proves the RELEASE build path works on every push.
#                     Artifacts stay private to the repo.
#   Codemagic       = DISTRIBUTE. Signed builds to TestFlight + Firebase App
#                     Distribution on a v* tag. It owns the Mac runners.
#
# WHY IT BUILDS RELEASE, NOT DEBUG:
# For 53 green runs this built `assembleDebug`. That is why a release APK with no
# INTERNET permission went unnoticed — debug inherits it from src/debug/. Release
# is a genuinely different path: R8/minification, resource shrinking, release
# signing, AOT. Building it here means the first `git tag` is not the first time
# that code path has ever executed.
#
# WHY APPETIZE IS NO LONGER AUTOMATIC:
# It previously uploaded a PRODUCTION-wired build to a PUBLIC Appetize URL on every
# push to main, and posted the link in the job summary. Anyone with that link could
# drive the production API — trigger OTP sends, consume endpoints. It is now a
# deliberate, manually-dispatched action that requires an explicit API URL.

name: Mobile — Release Verification

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      publish_to_appetize:
        description: 'Upload the build to a PUBLIC Appetize URL (demo only)'
        type: boolean
        default: false
      api_url:
        description: 'API base URL to compile in (use staging for shareable demos)'
        type: string
        default: 'https://loyalty-nexus-api.onrender.com/api/v1'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    name: Build & verify RELEASE artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Cache Gradle's dependency + wrapper caches.
      # Without this every run re-downloads the whole Kotlin/AGP plugin classpath
      # from Maven Central, and shared runner IPs get rate-limited:
      #   Could not GET '.../kotlin-stdlib-2.0.20.pom'. Received status code 429
      #   from server: Too Many Requests
      # That is a transient infra failure with a structural fix — stop making the
      # requests. It also cuts several minutes off each build.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with codemagic.yaml, ci.yml and the local dev SDK.
          # Drift here is what caused the CardTheme -> CardThemeData break.
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      # Release signing. The Gradle config now FAILS if key.properties is absent
      # rather than silently producing a debug-signed "release", so this must land.
      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > mobile/android/app/loyalty-nexus-release.jks
          if [ ! -s mobile/android/app/loyalty-nexus-release.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty or unset — a release build cannot be signed."
            exit 1
          fi

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Validate BEFORE writing. A secret can exist in GitHub with an EMPTY
          # value, and an empty alias fails 10 minutes later, deep inside
          # :app:packageRelease, with:
          #   KeytoolException: No key with alias '' found in keystore
          # This was invisible for 53 green runs because they were all DEBUG
          # builds, which use the debug signing config and never read this file.
          # STRIP CR/LF FIRST. A GitHub secret pasted from a terminal or editor can
          # carry a leading/trailing newline, and the value is then non-empty while
          # still being useless. With a LEADING CRLF the heredoc emits:
          #     keyAlias=<CR><LF>loyalty-nexus-release
          # so java.util.Properties reads keyAlias as EMPTY and the next line as
          # junk — producing exactly:
          #     KeytoolException: No key with alias '' found in keystore
          # Diagnosed from this workflow's own output: alias length reported 23 for
          # a 21-character alias. A plain -n check passes in that case, which is why
          # the earlier validation did not catch it.
          STORE_PASSWORD=$(printf '%s' "$STORE_PASSWORD" | tr -d '\015\012')
          KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\015\012')
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\015\012')


          missing=""
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_STORE_PASSWORD"
          [ -n "$KEY_PASSWORD" ]   || missing="$missing ANDROID_KEY_PASSWORD"
          [ -n "$KEY_ALIAS" ]      || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Empty release-signing secret(s):$missing"
            echo ""
            echo "The keystore below contains these aliases — set ANDROID_KEY_ALIAS"
            echo "to the correct one (alias names are not credentials):"
            keytool -list -keystore mobile/android/app/loyalty-nexus-release.jks                     -storepass "$STORE_PASSWORD" 2>/dev/null               | grep -iE "alias name|Your keystore contains" ||               echo "  (could not read the keystore — is ANDROID_STORE_PASSWORD correct?)"
            exit 1
          fi

          cat > mobile/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=loyalty-nexus-release.jks
          EOF
          echo "key.properties written (alias length: ${#KEY_ALIAS})"
          # Assert the file PARSES the way Java will read it: keyAlias must be a
          # non-empty value on its own line. Guards against any future whitespace
          # or quoting problem in a secret without ever echoing the value.
          alias_line=$(grep -c '^keyAlias=..*$' mobile/android/key.properties || true)
          if [ "$alias_line" != "1" ]; then
            echo "::error::key.properties has no valid non-empty keyAlias line."
            sed 's/=.*/=<redacted>/' mobile/android/key.properties
            exit 1
          fi
          echo "key.properties verified: keyAlias line is well-formed"

      # Firebase client configs are TRACKED in the repo and valid there. They are
      # NOT injected: they hold only public client identifiers that ship inside
      # every distributed binary. Overwriting them from a secret meant an unset
      # secret wrote an EMPTY file and failed the google-services Gradle plugin.

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        # Errors and warnings fail. Infos (style hints) do not.
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        working-directory: mobile
        # Deliberately NOT `|| true`. A test step that cannot fail manufactures
        # false confidence — that is how a missing test directory read as success
        # for 53 consecutive runs.
        run: flutter test --reporter=compact

      # Flutter's own path detection is broken for this project — its wrapper
      # reports "Gradle build failed to produce an .apk file" even when Gradle
      # ran assembleRelease to completion. The repo's ORIGINAL workflow hit the
      # same thing and worked around it by calling ./gradlew directly; replacing
      # that with `flutter build` reintroduced it.
      #
      # Rather than trust either the tool's exit code or a blanket `|| true`, the
      # ARTIFACT is the success criterion: build, then locate what was actually
      # produced. It is verified for real in the next step (permissions, signer),
      # so an artifact that exists but is wrong still fails the job.
      - name: Build RELEASE APK
        working-directory: mobile
        env:
          API_URL: ${{ inputs.api_url || 'https://loyalty-nexus-api.onrender.com/api/v1' }}
        run: |
          set +e
          flutter build apk --release             --build-number=${{ github.run_number }}             --dart-define=API_URL="$API_URL"
          rc=$?
          set -e
          echo "flutter exit code: $rc"

          # Search the WHOLE module, not just build/. This project's
          # android/build.gradle.kts has no buildDir redirect (newer Flutter
          # templates dropped it), so AGP writes to its default location —
          # android/app/build/outputs/apk/release/ — while the flutter tool only
          # looks under mobile/build/. That mismatch IS the "failed to produce an
          # .apk file" message; the artifact exists, just not where it looked.
          # The repo's original workflow used `find .` for exactly this reason.
          APK=$(find . -name '*.apk' -path '*release*' -size +1M 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced (flutter exit $rc)."
            echo "Any .apk anywhere under mobile/:"
            find . -name '*.apk' 2>/dev/null || echo "  (none)"
            echo "outputs dirs present:"
            find . -type d -name outputs 2>/dev/null || echo "  (none)"
            exit 1
          fi
          echo "found release APK: $APK"
          mkdir -p build/app/outputs/flutter-apk
          [ "$APK" = "build/app/outputs/flutter-apk/app-release.apk" ] ||             cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Build RELEASE AAB
        working-directory: mobile
        env:
          API_URL: ${{ inputs.api_url || 'https://loyalty-nexus-api.onrender.com/api/v1' }}
        # The Play Console format. Built here so its (different) packaging path is
        # exercised too, rather than discovered for the first time at submission.
        run: |
          set +e
          flutter build appbundle --release             --build-number=${{ github.run_number }}             --dart-define=API_URL="$API_URL"
          rc=$?
          set -e
          echo "flutter exit code: $rc"

          # Prefer the FINAL bundle under outputs/. Gradle also leaves an
          # UNSIGNED intermediary-bundle.aab under intermediates/, which is
          # larger and sorts first — the previous `find . -name '*.aab'`
          # picked exactly that, and Play rejects an unsigned bundle.
          AAB=$(find . -path '*outputs/bundle/*' -name '*.aab' -size +1M 2>/dev/null | head -1)
          [ -n "$AAB" ] || AAB=$(find . -name '*.aab' -size +1M -not -path '*intermediates*' 2>/dev/null | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::No release AAB was produced (flutter exit $rc)."
            echo "Any .aab anywhere under mobile/:"
            find . -name '*.aab' 2>/dev/null || echo "  (none)"
            exit 1
          fi
          echo "found release AAB: $AAB"
          mkdir -p build/app/outputs/bundle/release
          [ "$AAB" = "build/app/outputs/bundle/release/app-release.aab" ] ||             cp "$AAB" build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/bundle/release/app-release.aab

      # Guards against the exact class of bug that made this workflow necessary:
      # a release artifact that builds fine but is unusable on a device.
      - name: Verify release artifact
        working-directory: mobile
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          [ -f "$APK" ] || { echo "::error::release APK missing"; exit 1; }
          [ -f "$AAB" ] || { echo "::error::release AAB missing"; exit 1; }

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -r | head -1)
          echo "using $AAPT"

          # 1. INTERNET permission must be in the RELEASE manifest. It was once
          #    declared only in src/debug/, so release shipped with no network at
          #    all and every API call failed. Never again silently.
          PERMS=$("$AAPT" dump permissions "$APK")
          echo "$PERMS"
          echo "$PERMS" | grep -q 'android.permission.INTERNET' \
            || { echo "::error::release APK has NO INTERNET permission — the app would be inert"; exit 1; }

          # 2. Must not be debug-signed. A debug-signed release is Play-rejected and
          #    blocks in-place upgrades for anyone who already installed.
          #
          #    Uses apksigner, NOT `keytool -printcert -jarfile`. keytool reads only
          #    the V1 (JAR) signature; with minSdk 24 AGP may sign v2/v3 ONLY, in
          #    which case keytool prints nothing, the grep matches nothing, and the
          #    check SILENTLY PASSES. A verification that cannot fail is worse than
          #    no verification.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }
          CERTS=$("$APKSIGNER" verify --print-certs --verbose "$APK" 2>&1) || {
            echo "::error::apksigner could not verify the APK signature"; echo "$CERTS"; exit 1; }
          echo "$CERTS" | grep -E "Verified using|certificate DN" || true
          echo "$CERTS" | grep -qi "CN=Android Debug" \
            && { echo "::error::release APK is DEBUG-SIGNED"; exit 1; } || true
          # Positively assert a modern scheme verified, so a future signing-config
          # change cannot quietly ship an unverifiable artifact.
          echo "$CERTS" | grep -qE "Verified using v[234] scheme.*true" \
            || { echo "::error::no v2/v3/v4 signature verified"; exit 1; }

          # 3. Application id + label sanity.
          "$AAPT" dump badging "$APK" | grep -E "^package|application-label" || true

          ls -lh "$APK" "$AAB"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loyalty-nexus-release-${{ github.sha }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/mapping/release/mapping.txt
          retention-days: 14

      # ── Optional, manual only ────────────────────────────────────────────────
      - name: Upload to Appetize.io
        id: appetize
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_appetize }}
        run: |
          APK_PATH="mobile/build/app/outputs/flutter-apk/app-release.apk"
          if [ -n "${{ secrets.APPETIZE_PUBLIC_KEY }}" ]; then
            RESPONSE=$(curl -s -X POST \
              "https://api.appetize.io/v1/apps/${{ secrets.APPETIZE_PUBLIC_KEY }}" \
              -u "${{ secrets.APPETIZE_API_TOKEN }}:" \
              -F "file=@${APK_PATH}" -F "platform=android" \
              -F "note=Build ${{ github.sha }}")
          else
            RESPONSE=$(curl -s -X POST "https://api.appetize.io/v1/apps" \
              -u "${{ secrets.APPETIZE_API_TOKEN }}:" \
              -F "file=@${APK_PATH}" -F "platform=android" \
              -F "note=Loyalty Nexus — ${{ github.sha }}")
          fi
          PUBLIC_KEY=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('publicKey',''))")
          echo "app_url=https://appetize.io/app/${PUBLIC_KEY}" >> $GITHUB_OUTPUT

      - name: Summary
        if: always()
        run: |
          {
            echo "## 📱 Loyalty Nexus — Release Verification"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Build number | \`${{ github.run_number }}\` |"
            echo "| Artifacts | release APK + AAB + R8 mapping (private to this repo) |"
            if [ -n "${{ steps.appetize.outputs.app_url }}" ]; then
              echo "| Appetize (PUBLIC) | ${{ steps.appetize.outputs.app_url }} |"
            fi
            echo ""
            echo "Distribution to testers is handled by **Codemagic** on a \`v*\` tag —"
            echo "TestFlight for iOS, Firebase App Distribution for Android."
          } >> $GITHUB_STEP_SUMMARY
